<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

    <a class="navbar-brand" routerLink="/">

        <i class="fas fa-brain logo-icon"></i>

          <div class="logo-tagline">Learn Smarter</div>
        </div>
      </div>
    </a>

      type="button" 
      (click)="toggleNavbar()"

    </button>
    <div class="collapse navbar-collapse" [class.show]="!isCollapsed">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>

        <li class="nav-item">

        </li>
        <li class="nav-item">
          <a class="nav-link favorites-link" routerLink="/favorites" routerLinkActive="active">
            <i class="fas fa-heart me-1"></i>My List

          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
        </li>

          <a class="nav-link admin-link" routerLink="/admin" routerLinkActive="active">
            <i class="fas fa-cog me-1"></i>Admin
          </a>
        </li>

          <a class="nav-link admin-link" routerLink="/admin-login" routerLinkActive="active">
